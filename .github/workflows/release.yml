name: Build-Release

on:
  push:
    # Uncomment to test against a branch
    #branches:
    #  - ci
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        type: boolean
        description: 'Create GitHub release'
        default: false

jobs:
  build:
    name: Create Github release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # https://github.com/actions/checkout/issues/290
      - name: Preserve tag annotations
        run: git fetch -f origin ${{ github.ref }}:${{ github.ref }}
        if: startsWith(github.ref, 'refs/tags/')

      - name: Get version
        id: get_version
        run: |
          # For tags, use the tag name
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            version=$(git describe | sed -E 's/v([0-9]*\.[0-9]*)-([0-9]+)-g([0-9a-f]+)/v\1.r\2.g\3/')
          # For branches, use branch name + SHA
          else
            branch=${GITHUB_REF#refs/heads/}
            if [[ "$branch" == "refs/pull/"* ]]; then
              branch="pr-${GITHUB_REF#refs/pull/}"
            fi
            short_sha=$(git rev-parse --short HEAD)
            version="${branch}-${short_sha}"
            # Replace slashes with hyphens in version, the branch name may contain slashes.
            version=$(echo "$version" | sed 's/\//-/g')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using version: $version"

      - name: Validate gradle wrapper checksum
        uses: gradle/wrapper-validation-action@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Prepare keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo -n "${RELEASE_KEYSTORE_BASE64}" | base64 -d > keystore.jks
          else
            keytool -genkey -v -keystore debug.keystore -storetype PKCS12 -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create SSH KEY
        env:
          SIGNING_KEY_SECRET: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "${SIGNING_KEY_SECRET}" ]; then
            echo "${SIGNING_KEY_SECRET}" > pixelupdater.key
            chmod 600 pixelupdater.key
          fi

      - name: Build Release apk
        env:
          PROJECT_URL: https://github.com/${{ github.repository }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_PASSPHRASE_SECRET: ${{ secrets.RELEASE_KEY_PASSPHRASE }}
          RELEASE_KEYSTORE_PASSPHRASE_SECRET: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
          SIGNING_KEY_SECRET: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            export RELEASE_KEYSTORE="${GITHUB_WORKSPACE}/keystore.jks"
            export RELEASE_KEY_ALIAS="release"
            export RELEASE_KEY_PASSPHRASE="${RELEASE_KEY_PASSPHRASE_SECRET}"
            export RELEASE_KEYSTORE_PASSPHRASE="${RELEASE_KEYSTORE_PASSPHRASE_SECRET}"
          else
            export RELEASE_KEYSTORE="${GITHUB_WORKSPACE}/debug.keystore"
            export RELEASE_KEY_ALIAS="androiddebugkey"
            export RELEASE_KEY_PASSPHRASE="android"
            export RELEASE_KEYSTORE_PASSPHRASE="android"
          fi
          if [ -n "${SIGNING_KEY_SECRET}" ]; then
            export SIGNING_KEY="${GITHUB_WORKSPACE}/pixelupdater.key"
          else
            export SIGNING_KEY=""
          fi
          ./gradlew --write-verification-metadata sha256,sha512 help
          ./gradlew zipRelease
          if [ -n "${SIGNING_KEY}" ]; then
            ./gradlew signReleaseZip
          fi
          ./gradlew updateJsonRelease

      - name: Debug list artifacts
        run: |
          ls -lR app/build/distributions/release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelUpdater-artifacts-${{ steps.get_version.outputs.version }}-release
          path: app/build/distributions/release/*

      - name: Upload release-info
        uses: actions/upload-artifact@v4
        id: upload_release_info
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release.json
          path: app/build/distributions/release.json

      # https://github.com/ericcornelissen/git-tag-annotation-action/blob/v2.0.6/src/main.sh
      - name: Get annotation from git for-each-ref
        id: get_annotation
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo 'annotation<<EOF'
            git for-each-ref ${{ github.ref }} --format='%(contents)' | awk '/-BEGIN PGP SIGNATURE-/{exit} {print}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Create release only if it's a tag or requested
      - name: Create release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_annotation.outputs.annotation }}
          draft: true
          prerelease: false
          files: |
            app/build/distributions/release/PixelUpdater-${{ steps.get_version.outputs.version }}-release.zip
            app/build/distributions/release/PixelUpdater-${{ steps.get_version.outputs.version }}-release.zip.sig
